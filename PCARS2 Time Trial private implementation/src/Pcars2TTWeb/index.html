<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101519">
  <title>PCARS2 Time Trial</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="kicker">PROJECT CARS 2 / RECORDS</p>
        <h1>Time Trial Ledger</h1>
        <p class="lede">Personal bests, kept sharp.</p>
      </div>
      <div class="live-mark" aria-label="Live database status"><span></span> LIVE DATA</div>
    </header>

    <section class="toolbar" aria-label="Lap time filters">
      <div class="toolbar-head">
        <div>
          <p class="section-label">Browse records</p>
          <h2>Find the benchmark</h2>
        </div>
        <button id="reset" class="reset-button" type="button">Reset filters</button>
      </div>
      <div class="filters">
        <label>Track<select id="track"><option value="">All tracks</option></select></label>
        <label>Vehicle<select id="vehicle"><option value="">All vehicles</option></select></label>
        <label>Class<select id="vehicleClass"><option value="">All classes</option></select></label>
        <label>Gamer tag<select id="gamertag"><option value="">All drivers</option></select></label>
      </div>
    </section>

    <section class="results" aria-live="polite">
      <div class="results-head">
        <div>
          <p class="section-label">Best laps</p>
          <h2 id="result-title">All records</h2>
        </div>
        <div class="result-meta"><strong id="count">0</strong> records <button id="refresh" class="icon-button" type="button" title="Refresh records" aria-label="Refresh records">↻</button></div>
      </div>
      <div id="error" class="error" hidden></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Pos.</th><th>Driver</th><th>Vehicle</th><th>Class</th><th>Track</th><th>Lap time</th><th>Date</th></tr>
          </thead>
          <tbody id="rows"><tr><td colspan="7" class="empty">Loading records...</td></tr></tbody>
        </table>
      </div>
    </section>

    <footer><span>PCARS2TT</span><span>Best time per driver / vehicle / track / game</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
